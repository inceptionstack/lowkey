AWSTemplateFormatVersion: '2010-09-09'
Description: >
  OpenClaw Instance - Deploys a fully configured OpenClaw AI assistant on EC2
  within its own VPC. Designed for StackSet deployment across AWS Organization accounts.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "🔧 Basic Configuration"
        Parameters:
          - EnvironmentName
          - PackName
          - ProfileName
          - InstanceType
          - DefaultModel
      - Label:
          default: "🧠 Model Access"
        Parameters:
          - ModelMode
          - BedrockRegion
          - LiteLLMBaseUrl
          - LiteLLMApiKey
          - LiteLLMModel
          - ProviderApiKey
          - KiroFromSecret
          - TelegramBotTokenSecret
          - TelegramUser
          - KirocrewTgBotTokenSecret
          - KirocrewTgUserId
          - Primary
          - DailyDriver
          - CodexModel
          - RequestQuotaIncreases
      - Label:
          default: "🛡️ Security Services"
        Parameters:
          - EnableSecurityHub
          - EnableGuardDuty
          - EnableInspector
          - EnableAccessAnalyzer
          - EnableConfigRecorder
      - Label:
          default: "💾 Storage"
        Parameters:
          - RootVolumeSize
          - DataVolumeSize
      - Label:
          default: "🌐 Networking"
        Parameters:
          - VpcCidr
          - PublicSubnetCidr
          - ExistingVpcId
          - ExistingSubnetId
          - ExistingSubnetId2
          - SSHAllowedCidr
          - KeyPairName
      - Label:
          default: "⚙️ Advanced"
        Parameters:
          - OpenClawGatewayPort
          - LokiWatermark
    ParameterLabels:
      EnvironmentName:
        default: "Environment Name"
      ProfileName:
        default: "Permission Profile"
      InstanceType:
        default: "Instance Size"
      DefaultModel:
        default: "Default AI Model"
      ModelMode:
        default: "Model Access Mode"
      BedrockRegion:
        default: "Bedrock Region"
      LiteLLMBaseUrl:
        default: "LiteLLM Proxy URL"
      LiteLLMApiKey:
        default: "LiteLLM API Key"
      LiteLLMModel:
        default: "LiteLLM Model Name"
      ProviderApiKey:
        default: "Provider API Key (Anthropic etc.)"
      RequestQuotaIncreases:
        default: "Auto-Request Bedrock Quota Increases"
      EnableSecurityHub:
        default: "Enable AWS Security Hub"
      EnableGuardDuty:
        default: "Enable Amazon GuardDuty"
      EnableInspector:
        default: "Enable Amazon Inspector"
      EnableAccessAnalyzer:
        default: "Enable IAM Access Analyzer"
      EnableConfigRecorder:
        default: "Enable AWS Config Recorder"
      RootVolumeSize:
        default: "Root Volume Size (GB)"
      DataVolumeSize:
        default: "Data Volume Size (GB) - set 0 to skip"
      VpcCidr:
        default: "VPC CIDR Block"
      PublicSubnetCidr:
        default: "Public Subnet CIDR"
      SSHAllowedCidr:
        default: "SSH Access CIDR"
      KeyPairName:
        default: "SSH Key Pair (optional)"
      OpenClawGatewayPort:
        default: "Gateway Port"
      PackName:
        default: "Agent Pack"
      LokiWatermark:
        default: "Loki Watermark Tag"
      ExistingVpcId:
        default: "Existing VPC ID (leave empty to create new)"
      ExistingSubnetId:
        default: "Existing Public Subnet ID (AZ #1)"
      ExistingSubnetId2:
        default: "Second Existing Public Subnet ID (AZ #2, required for KiroCrew ALB)"

# ============================================================================
# PARAMETERS
# ============================================================================
Parameters:
  PackName:
    Type: String
    Default: openclaw
    AllowedValues:
      - openclaw
      - claude-code
      - hermes
      - kiro-cli
      - codex-cli
      - roundhouse
      - troika
      - kirocrew
    Description: "Agent pack to deploy. 'openclaw' is the stateful AI agent with 24/7 gateway (recommended). 'roundhouse' is the pi-based agent with Telegram. 'hermes' is the NousResearch CLI agent (lighter). 'kiro-cli' and 'codex-cli' are experimental. 'troika' installs OpenClaw/Hermes + Claude Code + Codex CLI on one instance (experimental). 'kirocrew' is the multi-agent crew gateway on Kiro CLI (experimental)."

  ProfileName:
    Type: String
    AllowedValues:
      - builder
      - account_assistant
      - personal_assistant
    Description: "Permission profile. 'builder' = full admin (AdministratorAccess). 'account_assistant' = read-only (ReadOnlyAccess). 'personal_assistant' = Bedrock inference only, no AWS access."

  EnvironmentName:
    Type: String
    Default: openclaw
    Description: "A short name for this deployment (e.g. 'my-openclaw'). Used as prefix for all AWS resources. Lowercase letters, numbers, and hyphens only."
    AllowedPattern: '[a-z0-9-]+'
    MaxLength: 24

  InstanceType:
    Type: String
    Default: t4g.xlarge
    Description: "EC2 instance size. t4g.medium works for light use. t4g.xlarge recommended for production. All options are ARM64 Graviton."
    AllowedValues:
      - t4g.medium
      - t4g.large
      - t4g.xlarge
      - t4g.2xlarge
      - m7g.medium
      - m7g.large
      - m7g.xlarge
      - c7g.large
      - c7g.xlarge

  VpcCidr:
    Type: String
    Default: '10.0.0.0/16'
    Description: "CIDR block for the new VPC. Change only if it conflicts with existing VPCs in your account."
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/\d{1,2}'

  PublicSubnetCidr:
    Type: String
    Default: '10.0.1.0/24'
    Description: "CIDR for the public subnet. Must be within the VPC CIDR range."
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/\d{1,2}'

  SSHAllowedCidr:
    Type: String
    Default: '127.0.0.1/32'
    Description: "IP range allowed to SSH. Default 127.0.0.1/32 disables SSH entirely - use AWS SSM Session Manager instead (recommended). Set to your-ip/32 to enable SSH."
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/\d{1,2}'

  RootVolumeSize:
    Type: Number
    Default: 40
    MinValue: 20
    MaxValue: 200
    Description: "Root disk size in GB. 40GB is sufficient for most deployments."

  DataVolumeSize:
    Type: Number
    Default: 80
    MinValue: 0
    MaxValue: 500
    Description: "Separate data volume for OpenClaw state and workspaces. Set to 0 to skip (uses root volume instead). 80GB recommended for OpenClaw, 0 for Hermes."

  KeyPairName:
    Type: String
    Default: ''
    Description: "EC2 key pair for SSH access. Leave blank to skip - SSM Session Manager is the recommended access method."

  OpenClawGatewayPort:
    Type: Number
    Default: 3001
    MinValue: 1024
    MaxValue: 65535
    Description: "Internal port for the OpenClaw gateway service. Change only if port 3001 conflicts with other services."

  BedrockRegion:
    Type: String
    Default: us-east-1
    Description: "AWS region for Bedrock API calls. us-east-1 has the widest model selection."
    AllowedValues:
      - us-east-1
      - us-west-2
      - eu-west-1
      - eu-central-1
      - eu-north-1
      - ap-northeast-1
      - ap-southeast-1

  DefaultModel:
    Type: String
    Default: 'us.anthropic.claude-sonnet-4-6'
    Description: "The primary AI model. Claude Sonnet 4.6 is recommended (best cost/performance balance). Used when ModelMode is 'bedrock'."

  ModelMode:
    Type: String
    Default: 'bedrock'
    AllowedValues:
      - litellm
      - api-key
      - bedrock
    Description: "How OpenClaw connects to AI models. 'bedrock' uses AWS Bedrock (recommended, no extra keys needed). 'litellm' routes through a LiteLLM proxy. 'api-key' uses a provider API key directly."

  LiteLLMBaseUrl:
    Type: String
    Default: ''
    Description: "URL of your LiteLLM proxy server. Only needed when Model Access Mode is 'litellm'. Leave empty otherwise."

  LiteLLMApiKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: "API key for authenticating with the LiteLLM proxy. Only needed when Model Access Mode is 'litellm'."

  LiteLLMModel:
    Type: String
    Default: 'claude-sonnet-4-6'
    Description: "Default model alias on your LiteLLM proxy (e.g. 'claude-sonnet-4-6'). Only used when Model Access Mode is 'litellm'."

  ProviderApiKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: "Direct API key from your AI provider (e.g. Anthropic). Only needed when Model Access Mode is 'api-key'."

  KiroFromSecret:
    Type: String
    Default: ''
    Description: "AWS Secrets Manager secret id/arn whose SecretString is the Kiro API key (kiro-cli pack only, headless mode). The raw key is NOT stored in this template - the instance resolves the secret at install time via its IAM role."

  TelegramBotTokenSecret:
    Type: String
    Default: ''
    Description: "AWS Secrets Manager secret id/arn containing the Telegram bot token (roundhouse pack only). The instance resolves the secret at install time via its IAM role."

  TelegramUser:
    Type: String
    Default: ''
    Description: "Telegram username for bot pairing (roundhouse pack only, without @ prefix)."

  KirocrewTgBotTokenSecret:
    Type: String
    Default: ''
    Description: "AWS Secrets Manager secret id/arn holding the KiroCrew Telegram bot token (kirocrew pack only). The instance resolves the secret at bootstrap time via its IAM role — the token itself is never embedded in UserData."

  KirocrewTgUserId:
    Type: String
    Default: ''
    Description: "KiroCrew Telegram numeric user ID (kirocrew pack only). Opt-in wiring. Digits only. Not sensitive (same class as TelegramUser)."


  Primary:
    Type: String
    Default: openclaw
    AllowedValues:
      - openclaw
      - hermes
    Description: "Troika pack only: the OpenClaw-family first horse (openclaw or hermes). Ignored for other packs."

  DailyDriver:
    Type: String
    Default: ''
    Description: "Troika pack only: agent to auto-launch when you SSM into the instance (openclaw, hermes, claude-code, codex-cli, none; default=primary). Ignored for other packs."

  CodexModel:
    Type: String
    Default: 'openai.gpt-5.5'
    Description: "Troika pack only: Bedrock Mantle model ID for Codex CLI. Ignored for other packs."

  EnableBedrockForm:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: "Submit the Bedrock model access use-case form. Only needed once per account - skip if Bedrock is already enabled."

  RequestQuotaIncreases:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: "Automatically request higher Bedrock rate limits during deployment. Set to 'true' if you expect heavy usage."

  EnableSecurityHub:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: "AWS Security Hub aggregates security findings from multiple services into a single dashboard. Enables CIS Benchmarks and AWS Foundational Security Best Practices standards. (~$0.001 per finding/month)"

  EnableGuardDuty:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: "Amazon GuardDuty provides intelligent threat detection by analyzing CloudTrail, VPC Flow Logs, and DNS queries. Alerts on suspicious activity like cryptocurrency mining, data exfiltration, or unauthorized access. (~$4/million events)"

  EnableInspector:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: "Amazon Inspector automatically scans EC2 instances, container images, and Lambda functions for software vulnerabilities and unintended network exposure. (~$0.01-$1.25 per resource/month)"

  EnableAccessAnalyzer:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: "IAM Access Analyzer identifies resources shared with external entities and validates IAM policies. Helps ensure least-privilege access. (Free)"

  EnableConfigRecorder:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: "AWS Config records resource configuration changes and evaluates compliance against rules. Required by Security Hub for many checks. (~$0.003 per item recorded/month)"

  LokiWatermark:
    Type: String
    Default: 'lowkey'
    Description: "Custom identifier tag applied to all resources. Use to distinguish multiple Loki deployments or mark team ownership (e.g. 'team-alpha', 'dev-loki')."

  ExistingVpcId:
    Type: String
    Default: ''
    Description: "Reuse an existing Loki VPC instead of creating a new one. Leave empty to create a new VPC."
    AllowedPattern: '^(vpc-[a-z0-9]+)?$'

  ExistingSubnetId:
    Type: String
    Default: ''
    Description: "Public subnet ID in the existing VPC. Required if ExistingVpcId is set."
    AllowedPattern: '^(subnet-[a-z0-9]+)?$'

  ExistingSubnetId2:
    Type: String
    Default: ''
    Description: "Second public subnet ID in a different AZ. Required for KiroCrew pack (ALB needs 2 AZs) when ExistingVpcId is set."
    AllowedPattern: '^(subnet-[a-z0-9]+)?$'

  RepoBranch:
    Type: String
    Default: 'main'
    Description: "Git branch to clone on the EC2 instance. Use for testing feature branches."

  EnableWebUIAuth:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: "Enable Cognito-based WebUI authentication for KiroCrew dashboard."

  WebUIAdminEmail:
    Type: String
    Default: ''
    Description: "Email for the initial WebUI admin user. Required when EnableWebUIAuth is true."
    AllowedPattern: '^([^@]+@[^@]+\.[^@]+)?$'

  EdgeLambdaVersionArn:
    Type: String
    Default: ''
    Description: "Versioned ARN of the Lambda@Edge function (produced by the companion edge-stack in us-east-1). Required when EnableWebUIAuth is true."

  EdgeConfigSecretName:
    Type: String
    Default: ''
    Description: "Name of the us-east-1 Secrets Manager secret holding the merged Cognito config for the Lambda@Edge. Required when EnableWebUIAuth is true."

  EdgeConfigSecretArn:
    Type: String
    Default: ''
    Description: "Full ARN of the us-east-1 edge config secret. Required when EnableWebUIAuth is true."

  SigningKeySecretName:
    Type: String
    Default: ''
    Description: "Name of the us-east-1 Secrets Manager secret holding the raw signing key. Required when EnableWebUIAuth is true."

  SigningKeySecretArn:
    Type: String
    Default: ''
    Description: "Full ARN of the us-east-1 signing key secret. Required when EnableWebUIAuth is true."
# ============================================================================
# RULES
# ============================================================================
Rules:
  SubnetRequiredWithVpc:
    RuleCondition: !Not [!Equals [!Ref ExistingVpcId, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref ExistingSubnetId, '']]
        AssertDescription: "ExistingSubnetId is required when ExistingVpcId is provided."
  VpcRequiredWithSubnet:
    RuleCondition: !Not [!Equals [!Ref ExistingSubnetId, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref ExistingVpcId, '']]
        AssertDescription: "ExistingVpcId is required when ExistingSubnetId is provided."
  KiroCrewSubnet2RequiredWithExistingVpc:
    RuleCondition: !And
      - !Equals [!Ref PackName, 'kirocrew']
      - !Not [!Equals [!Ref ExistingVpcId, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref ExistingSubnetId2, '']]
        AssertDescription: "ExistingSubnetId2 (second AZ) is required for KiroCrew pack when ExistingVpcId is set - ALB needs 2 subnets in different AZs."
      - Assert: !Not [!Equals [!Ref ExistingSubnetId2, !Ref ExistingSubnetId]]
        AssertDescription: "ExistingSubnetId2 must be different from ExistingSubnetId (different AZs)."

  WebUIAdminEmailRequired:
    RuleCondition: !Equals [!Ref EnableWebUIAuth, 'true']
    Assertions:
      - Assert: !Not [!Equals [!Ref WebUIAdminEmail, '']]
        AssertDescription: "WebUIAdminEmail is required when EnableWebUIAuth is true."

  WebUIEdgeRequiresParams:
    RuleCondition: !Equals [!Ref EnableWebUIAuth, 'true']
    Assertions:
      - Assert: !Not [!Equals [!Ref EdgeLambdaVersionArn, '']]
        AssertDescription: "EdgeLambdaVersionArn is required when EnableWebUIAuth is true (installer deploys the companion edge stack in us-east-1 first and passes its outputs to this stack)."
      - Assert: !Not [!Equals [!Ref EdgeConfigSecretName, '']]
        AssertDescription: "EdgeConfigSecretName is required when EnableWebUIAuth is true (from the edge stack outputs)."
      - Assert: !Not [!Equals [!Ref EdgeConfigSecretArn, '']]
        AssertDescription: "EdgeConfigSecretArn is required when EnableWebUIAuth is true (from the edge stack outputs)."
      - Assert: !Not [!Equals [!Ref SigningKeySecretName, '']]
        AssertDescription: "SigningKeySecretName is required when EnableWebUIAuth is true (from the edge stack outputs)."
      - Assert: !Not [!Equals [!Ref SigningKeySecretArn, '']]
        AssertDescription: "SigningKeySecretArn is required when EnableWebUIAuth is true (from the edge stack outputs)."

# ============================================================================
# CONDITIONS
# ============================================================================
Conditions:
  HasKeyPair: !Not [!Equals [!Ref KeyPairName, '']]
  HasDataVolume: !Not [!Equals [!Ref DataVolumeSize, 0]]
  IsLiteLLM: !Equals [!Ref ModelMode, 'litellm']
  IsApiKey: !Equals [!Ref ModelMode, 'api-key']
  IsBedrock: !Equals [!Ref ModelMode, 'bedrock']
  CreateNewVpc: !Equals [!Ref ExistingVpcId, '']
  IsBuilder: !Equals [!Ref ProfileName, 'builder']
  IsNotBuilder: !Not [!Condition IsBuilder]
  IsAccountAssistant: !Equals [!Ref ProfileName, 'account_assistant']
  IsPersonalAssistant: !Equals [!Ref ProfileName, 'personal_assistant']
  RunSecurityServices: !Not [!Condition IsPersonalAssistant]
  RunBedrockForm: !Equals [!Ref EnableBedrockForm, 'true']
  IsKiroCrew: !Equals [!Ref PackName, 'kirocrew']
  EnableWebUI: !And
    - !Condition IsKiroCrew
    - !Equals [!Ref EnableWebUIAuth, 'true']
  # KiroCrewSubnet2 (in-template second AZ subnet) only needed on new-VPC path;
  # existing-VPC path uses ExistingSubnetId2 passed by the caller.
  KiroCrewNeedsSubnet2: !And
    - !Condition IsKiroCrew
    - !Condition CreateNewVpc

# ============================================================================
# RESOURCES
# ============================================================================
Resources:

  # --------------------------------------------------------------------------
  # VPC & Networking
  # --------------------------------------------------------------------------
  VPC:
    Type: AWS::EC2::VPC
    Condition: CreateNewVpc
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-vpc'
        - Key: loki:managed
          Value: 'true'
        - Key: loki:watermark
          Value: !Ref LokiWatermark
        - Key: loki:deploy-method
          Value: cloudformation
        - Key: loki:pack
          Value: !Ref PackName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: CreateNewVpc
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-igw'
        - Key: loki:managed
          Value: 'true'
        - Key: loki:watermark
          Value: !Ref LokiWatermark
        - Key: loki:deploy-method
          Value: cloudformation

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: CreateNewVpc
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Condition: CreateNewVpc
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnetCidr
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public'
        - Key: loki:managed
          Value: 'true'
        - Key: loki:watermark
          Value: !Ref LokiWatermark
        - Key: loki:deploy-method
          Value: cloudformation

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateNewVpc
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public-routes'
        - Key: loki:managed
          Value: 'true'
        - Key: loki:watermark
          Value: !Ref LokiWatermark
        - Key: loki:deploy-method
          Value: cloudformation

  PublicRoute:
    Type: AWS::EC2::Route
    Condition: CreateNewVpc
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateNewVpc
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # --------------------------------------------------------------------------
  # KiroCrew: Second subnet (ALB requires 2 AZs)
  # --------------------------------------------------------------------------
  KiroCrewSubnet2:
    Type: AWS::EC2::Subnet
    Condition: KiroCrewNeedsSubnet2
    Properties:
      VpcId: !Ref VPC
      CidrBlock: '10.0.2.0/24'
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public-2'
        - Key: loki:managed
          Value: 'true'
        - Key: loki:watermark
          Value: !Ref LokiWatermark

  KiroCrewSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: KiroCrewNeedsSubnet2
    Properties:
      SubnetId: !Ref KiroCrewSubnet2
      RouteTableId: !Ref PublicRouteTable

  # --------------------------------------------------------------------------
  # KiroCrew: ALB + Target Group + CloudFront
  # --------------------------------------------------------------------------
  KiroCrewALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: IsKiroCrew
    Properties:
      GroupName: !Sub '${AWS::StackName}-kirocrew-alb-sg'
      GroupDescription: ALB for KiroCrew dashboard (CloudFront origin-facing only)
      VpcId: !If [CreateNewVpc, !Ref VPC, !Ref ExistingVpcId]
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: '0.0.0.0/0'
          Description: HTTP from CloudFront (prefix list not available in all regions - origin-verify header enforces)
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: '0.0.0.0/0'
          Description: All outbound
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-kirocrew-alb-sg'
        - Key: loki:managed
          Value: 'true'
        - Key: loki:watermark
          Value: !Ref LokiWatermark

  KiroCrewALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Condition: IsKiroCrew
    Properties:
      Name: !Sub '${EnvironmentName}-kirocrew-alb'
      Scheme: internet-facing
      Type: application
      Subnets:
        - !If [CreateNewVpc, !Ref PublicSubnet, !Ref ExistingSubnetId]
        - !If [CreateNewVpc, !Ref KiroCrewSubnet2, !Ref ExistingSubnetId2]
      SecurityGroups:
        - !Ref KiroCrewALBSecurityGroup
      Tags:
        - Key: loki:managed
          Value: 'true'
        - Key: loki:watermark
          Value: !Ref LokiWatermark
        - Key: loki:pack
          Value: kirocrew

  KiroCrewTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: IsKiroCrew
    Properties:
      Name: !Sub '${EnvironmentName}-kirocrew-tg'
      Port: 5476
      Protocol: HTTP
      VpcId: !If [CreateNewVpc, !Ref VPC, !Ref ExistingVpcId]
      TargetType: instance
      Targets:
        - Id: !Ref Instance
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Tags:
        - Key: loki:managed
          Value: 'true'

  KiroCrewHTTPListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: IsKiroCrew
    Properties:
      LoadBalancerArn: !Ref KiroCrewALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            ContentType: text/plain
            MessageBody: Forbidden
            StatusCode: '403'

  KiroCrewOriginVerifyListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: IsKiroCrew
    Properties:
      ListenerArn: !Ref KiroCrewHTTPListener
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: x-origin-verify
            Values:
              - !Sub '{{resolve:secretsmanager:${KiroCrewOriginVerifySecret}}}'
      Actions:
        - Type: forward
          TargetGroupArn: !Ref KiroCrewTargetGroup

  KiroCrewOriginVerifySecret:
    Type: AWS::SecretsManager::Secret
    Condition: IsKiroCrew
    Properties:
      Name: !Sub '/lowkey/${EnvironmentName}/kirocrew-origin-verify'
      Description: Origin verify header value - CloudFront injects, ALB validates
      GenerateSecretString:
        ExcludePunctuation: true
        PasswordLength: 32
      Tags:
        - Key: loki:managed
          Value: 'true'
        - Key: loki:pack
          Value: kirocrew

  # (Removed KiroCrewProtoHeaderFunction: CloudFront viewer-request functions
  # are not allowed to write x-forwarded-proto — CloudFront reserves it. The
  # distribution's built-in CloudFront-Forwarded-Proto header serves the same
  # purpose and is delivered to the origin automatically.)

  KiroCrewDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: IsKiroCrew
    DependsOn: KiroCrewALB
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'KiroCrew dashboard (${EnvironmentName})'
        HttpVersion: http2and3
        DefaultCacheBehavior:
          TargetOriginId: kirocrew-alb-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - POST
            - PATCH
            - DELETE
          CachePolicyId: '4135ea2d-6df8-44a3-9df3-4b5a84be39ad'  # CachingDisabled
          OriginRequestPolicyId: '216adef6-5c7f-47e4-b989-5492eafa07d3'  # AllViewer
          LambdaFunctionAssociations: !If
            - EnableWebUI
            - - EventType: viewer-request
                LambdaFunctionARN: !Ref EdgeLambdaVersionArn
                IncludeBody: false
            - !Ref 'AWS::NoValue'
        Origins:
          - Id: kirocrew-alb-origin
            DomainName: !GetAtt KiroCrewALB.DNSName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
              OriginSSLProtocols:
                - TLSv1.2
            OriginCustomHeaders:
              - HeaderName: x-origin-verify
                HeaderValue: !Sub '{{resolve:secretsmanager:${KiroCrewOriginVerifySecret}}}'
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - Key: loki:managed
          Value: 'true'
        - Key: loki:watermark
          Value: !Ref LokiWatermark
        - Key: loki:pack
          Value: kirocrew

  # --------------------------------------------------------------------------
  # Security Group
  # --------------------------------------------------------------------------
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${AWS::StackName}-sg'
      GroupDescription: !Sub 'Security group for ${EnvironmentName} EC2 instance (${AWS::StackName})'
      VpcId: !If [CreateNewVpc, !Ref VPC, !Ref ExistingVpcId]
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHAllowedCidr
          Description: SSH access
        - !If
          - IsKiroCrew
          - IpProtocol: tcp
            FromPort: 5476
            ToPort: 5476
            SourceSecurityGroupId: !Ref KiroCrewALBSecurityGroup
            Description: KiroCrew gateway from ALB only
          - !Ref 'AWS::NoValue'
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: '0.0.0.0/0'
          Description: All outbound traffic
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-sg'
        - Key: loki:managed
          Value: 'true'
        - Key: loki:watermark
          Value: !Ref LokiWatermark
        - Key: loki:deploy-method
          Value: cloudformation

  # --------------------------------------------------------------------------
  # IAM Role & Instance Profile
  # --------------------------------------------------------------------------
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - !If [IsBuilder, 'arn:aws:iam::aws:policy/AdministratorAccess', !Ref 'AWS::NoValue']
        - !If [IsAccountAssistant, 'arn:aws:iam::aws:policy/ReadOnlyAccess', !Ref 'AWS::NoValue']
      Policies:
        # KiroCrew Telegram bot-token secret read access.
        # Inline on the role (not a sibling AWS::IAM::Policy) so it is
        # attached at role creation — the Instance's DependsOn InstanceProfile
        # is then sufficient and there is no race between UserData starting
        # and the permission propagating (Codex P1 on 818c0f8).
        #
        # Installer always passes a plain secret name in the form
        # /lowkey/<env>/kirocrew-telegram-bot-token, so the Resource is a
        # single well-formed ARN built via !Sub — never mix a plain name
        # with a pre-built ARN (Codex P1 on 818c0f8: doing both produced
        # arn:...:secret:arn:aws:... which is malformed).
        #
        # Empty parameter → empty policy statement action; harmless because
        # the resource pattern won't match anything, but the statement is
        # present on the role so no follow-up IAM propagation is required.
        - PolicyName: !Sub '${EnvironmentName}-kirocrew-tg-secret-read'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadKirocrewTelegramBotToken
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${KirocrewTgBotTokenSecret}*'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-role'
        - Key: loki:managed
          Value: 'true'
        - Key: loki:watermark
          Value: !Ref LokiWatermark
        - Key: loki:deploy-method
          Value: cloudformation

  # Bootstrap operations for non-builder profiles (SSM status + cfn-signal)
  # Builder has AdministratorAccess which already includes these permissions.
  BootstrapOperationsPolicy:
    Type: AWS::IAM::Policy
    Condition: IsNotBuilder
    Properties:
      PolicyName: !Sub '${EnvironmentName}-bootstrap-ops'
      Roles:
        - !Ref InstanceRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: BootstrapOperations
            Effect: Allow
            Action:
              - ssm:PutParameter
              - ssm:DeleteParameter
              - cloudformation:SignalResource
            Resource:
              - !Sub 'arn:aws:ssm:*:${AWS::AccountId}:parameter/loki/*'
              - !Sub 'arn:aws:cloudformation:*:${AWS::AccountId}:stack/*'

  # Bedrock inference for account_assistant (ReadOnlyAccess does not include invoke)
  AccountAssistantBedrockPolicy:
    Type: AWS::IAM::Policy
    Condition: IsAccountAssistant
    Properties:
      PolicyName: !Sub '${EnvironmentName}-bedrock-inference'
      Roles:
        - !Ref InstanceRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: BedrockInference
            Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
              - bedrock:GetUseCaseForModelAccess
              - bedrock:ListFoundationModels
              - bedrock:GetFoundationModel
              - bedrock:ListInferenceProfiles
            Resource: '*'

  # Deny policy for account_assistant - secrets, S3 objects, Lambda code
  AccountAssistantDenyPolicy:
    Type: AWS::IAM::Policy
    Condition: IsAccountAssistant
    Properties:
      PolicyName: !Sub '${EnvironmentName}-deny-secrets-s3'
      Roles:
        - !Ref InstanceRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenySecretValues
            Effect: Deny
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:GetResourcePolicy
            NotResource:
              # Bootstrap needs to read the KiroCrew Telegram bot-token secret
              # (installer-managed, plain name /lowkey/<env>/kirocrew-telegram-bot-token)
              # even under account_assistant. Explicit Deny always wins over the
              # matching Allow on InstanceRole, so exempt this one ARN pattern
              # via NotResource (Codex P1 on 818c0f8).
              - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${KirocrewTgBotTokenSecret}*'
          - Sid: DenyS3ObjectAccess
            Effect: Deny
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:GetObjectAcl
            Resource: '*'
          - Sid: DenyLambdaCodeAccess
            Effect: Deny
            Action:
              - lambda:GetFunction
            Resource: '*'

  # Inline policy for personal_assistant (Bedrock + SSM connectivity + STS only)
  PersonalAssistantPolicy:
    Type: AWS::IAM::Policy
    Condition: IsPersonalAssistant
    Properties:
      PolicyName: !Sub '${EnvironmentName}-bedrock-only'
      Roles:
        - !Ref InstanceRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: BedrockInference
            Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
              - bedrock:GetUseCaseForModelAccess
            Resource: '*'
          - Sid: SSMConnectivity
            Effect: Allow
            Action:
              - ssm:UpdateInstanceInformation
              - ssmmessages:CreateControlChannel
              - ssmmessages:CreateDataChannel
              - ssmmessages:OpenControlChannel
              - ssmmessages:OpenDataChannel
              - ec2messages:AcknowledgeMessage
              - ec2messages:DeleteMessage
              - ec2messages:FailMessage
              - ec2messages:GetEndpoint
              - ec2messages:GetMessages
              - ec2messages:SendReply
            Resource: '*'
          - Sid: BedrockDiscovery
            Effect: Allow
            Action:
              - bedrock:ListFoundationModels
              - bedrock:GetFoundationModel
              - bedrock:ListInferenceProfiles
            Resource: '*'
          - Sid: Identity
            Effect: Allow
            Action:
              - sts:GetCallerIdentity
            Resource: '*'

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${EnvironmentName}-profile'
      Roles:
        - !Ref InstanceRole

  # --------------------------------------------------------------------------
  # Bedrock Model Access (Lambda Custom Resource)
  # --------------------------------------------------------------------------
  BedrockFormLambdaRole:
    Type: AWS::IAM::Role
    Condition: RunBedrockForm
    Properties:
      RoleName: !Sub '${EnvironmentName}-bedrock-form-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: bedrock-form
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:PutUseCaseForModelAccess
                  - bedrock:GetUseCaseForModelAccess
                Resource: '*'
              - Effect: Allow
                Action:
                  - servicequotas:RequestServiceQuotaIncrease
                  - servicequotas:GetServiceQuota
                  - servicequotas:ListRequestedServiceQuotaChangeHistory
                Resource: '*'

  BedrockFormFunction:
    Type: AWS::Lambda::Function
    Condition: RunBedrockForm
    Properties:
      FunctionName: !Sub '${EnvironmentName}-bedrock-form'
      Runtime: python3.12
      Handler: index.handler
      Timeout: 120
      Role: !GetAtt BedrockFormLambdaRole.Arn
      Code:
        ZipFile: |
          import json, time, urllib.request, boto3, traceback

          def send_response(event, context, status, reason='', data={}):
              # CFN responses must be under 4096 bytes total
              reason_str = (reason or f'See CW: {context.log_stream_name}')[:256]
              phys_id = (context.log_stream_name or 'custom-resource')[-64:]
              safe_data = {k: str(v)[:128] for k, v in (data or {}).items()}
              body = json.dumps({
                  'Status': status, 'Reason': reason_str,
                  'PhysicalResourceId': phys_id,
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': safe_data if len(json.dumps(safe_data)) < 1024 else {}
              }).encode()
              req = urllib.request.Request(event['ResponseURL'], data=body,
                  headers={'Content-Type': 'application/json', 'Content-Length': len(body)},
                  method='PUT')
              urllib.request.urlopen(req)

          def request_quota_increases():
              """Request higher Bedrock quotas for Opus 4.6 cross-region inference."""
              sq = boto3.client('servicequotas', region_name='us-east-1')
              quotas = [
                  ('L-11DFF789', 1000, 'Cross-region RPM Opus 4.6'),
                  ('L-0AD9BBE8', 4000000, 'Cross-region TPM Opus 4.6'),
              ]
              for code, desired, name in quotas:
                  try:
                      current = sq.get_service_quota(ServiceCode='bedrock', QuotaCode=code)
                      current_val = current['Quota']['Value']
                      if current_val >= desired:
                          print(f"[OK] {name}: already at {current_val}")
                          continue
                      sq.request_service_quota_increase(
                          ServiceCode='bedrock', QuotaCode=code, DesiredValue=desired
                      )
                      print(f"[OK] {name}: requested {current_val} -> {desired}")
                  except Exception as e:
                      print(f"[WARN] {name} quota request failed: {e}")

          def handler(event, context):
              print(f"[INFO] Event: {json.dumps(event)}")
              if event['RequestType'] == 'Delete':
                  send_response(event, context, 'SUCCESS', 'Delete is a no-op')
                  return

              client = boto3.client('bedrock', region_name='us-east-1')
              form_payload = json.dumps({
                  "companyName": "My Company",
                  "companyWebsite": "https://example.com",
                  "intendedUsers": "0",
                  "industryOption": "Education",
                  "otherIndustryOption": "",
                  "useCases": "AI development"
              }).encode()

              try:
                  # Check if already submitted
                  try:
                      existing = client.get_use_case_for_model_access()
                      print(f"[OK] Form already submitted: {existing.get('formData', '')[:50]}...")
                      if event.get('ResourceProperties', {}).get('RequestQuotas') == 'true':
                          request_quota_increases()
                      send_response(event, context, 'SUCCESS', 'Form already submitted',
                          {'FormStatus': 'ALREADY_SUBMITTED'})
                      return
                  except client.exceptions.ResourceNotFoundException:
                      print("[INFO] Form not yet submitted, submitting now...")

                  # Submit the form
                  print(f"[INFO] Submitting form ({len(form_payload)} bytes)")
                  client.put_use_case_for_model_access(formData=form_payload)
                  print("[OK] Form submitted successfully")

                  # Verify it was accepted
                  time.sleep(2)
                  try:
                      verify = client.get_use_case_for_model_access()
                      print(f"[OK] Form verified: {verify.get('formData', '')[:50]}...")
                  except client.exceptions.ResourceNotFoundException:
                      print("[WARN] Form not found after submission ? may need manual action")

                  # Request Bedrock quota increases if enabled
                  if event.get('ResourceProperties', {}).get('RequestQuotas') == 'true':
                      request_quota_increases()

                  send_response(event, context, 'SUCCESS', 'Form submitted',
                      {'FormStatus': 'SUBMITTED'})

              except Exception as e:
                  tb = traceback.format_exc()
                  print(f"[FAIL] {e}\n{tb}")
                  # Always succeed so stack doesn't rollback
                  send_response(event, context, 'SUCCESS',
                      f'Form submission failed: {e} ? manual action required',
                      {'FormStatus': 'FAILED', 'Error': str(e)})

  BedrockFormCustomResource:
    Type: Custom::BedrockForm
    Condition: RunBedrockForm
    DependsOn: BedrockFormLambdaRole
    Properties:
      ServiceToken: !GetAtt BedrockFormFunction.Arn
      RequestQuotas: !Ref RequestQuotaIncreases

  # --------------------------------------------------------------------------
  # Security Services Enablement
  # --------------------------------------------------------------------------
  SecurityEnablementRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-security-enable-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: security-services
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - securityhub:EnableSecurityHub
                  - securityhub:DescribeHub
                  - securityhub:BatchEnableStandards
                  - guardduty:CreateDetector
                  - guardduty:ListDetectors
                  - inspector2:Enable
                  - inspector2:BatchGetAccountStatus
                  - access-analyzer:CreateAnalyzer
                  - access-analyzer:ListAnalyzers
                  - config:PutConfigurationRecorder
                  - config:PutDeliveryChannel
                  - config:StartConfigurationRecorder
                  - config:DescribeConfigurationRecorders
                  - config:DescribeDeliveryChannels
                  - s3:CreateBucket
                  - s3:PutBucketPolicy
                  - s3:GetBucketPolicy
                  - iam:CreateServiceLinkedRole
                  - iam:GetRole
                Resource: '*'

  SecurityEnablementFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${EnvironmentName}-security-enable'
      Runtime: python3.12
      Handler: index.handler
      Timeout: 120
      Role: !GetAtt SecurityEnablementRole.Arn
      Code:
        ZipFile: |
          import json, urllib.request, boto3, traceback

          def send_response(event, context, status, reason='', data={}):
              # CFN responses must be under 4096 bytes total
              reason_str = (reason or f'See CW: {context.log_stream_name}')[:256]
              phys_id = (context.log_stream_name or 'custom-resource')[-64:]
              safe_data = {k: str(v)[:128] for k, v in (data or {}).items()}
              body = json.dumps({
                  'Status': status, 'Reason': reason_str,
                  'PhysicalResourceId': phys_id,
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': safe_data if len(json.dumps(safe_data)) < 1024 else {}
              }).encode()
              req = urllib.request.Request(event['ResponseURL'], data=body,
                  headers={'Content-Type': 'application/json', 'Content-Length': len(body)},
                  method='PUT')
              urllib.request.urlopen(req)

          def handler(event, context):
              print(f"[INFO] Event: {json.dumps(event)}")
              if event['RequestType'] == 'Delete':
                  send_response(event, context, 'SUCCESS', 'Delete is a no-op')
                  return

              props = event.get('ResourceProperties', {})
              enable_sh = props.get('EnableSecurityHub', 'true') == 'true'
              enable_gd = props.get('EnableGuardDuty', 'true') == 'true'
              enable_insp = props.get('EnableInspector', 'true') == 'true'
              enable_aa = props.get('EnableAccessAnalyzer', 'true') == 'true'
              enable_cfg = props.get('EnableConfigRecorder', 'true') == 'true'

              region = 'us-east-1'
              account_id = context.invoked_function_arn.split(':')[4]
              results = []

              # 1. Security Hub
              if enable_sh:
                  try:
                      sh = boto3.client('securityhub', region_name=region)
                      try:
                          sh.describe_hub()
                          print("[OK] Security Hub already enabled")
                      except:
                          sh.enable_security_hub(EnableDefaultStandards=True)
                          print("[OK] Security Hub enabled")
                      results.append('SecurityHub:OK')
                  except Exception as e:
                      print(f"[WARN] Security Hub: {e}")
                      results.append(f'SecurityHub:WARN')
              else:
                  results.append('SecurityHub:SKIPPED')

              # 2. GuardDuty
              if enable_gd:
                  try:
                      gd = boto3.client('guardduty', region_name=region)
                      detectors = gd.list_detectors()['DetectorIds']
                      if detectors:
                          print(f"[OK] GuardDuty already enabled: {detectors[0]}")
                      else:
                          resp = gd.create_detector(Enable=True, FindingPublishingFrequency='FIFTEEN_MINUTES')
                          print(f"[OK] GuardDuty enabled: {resp['DetectorId']}")
                      results.append('GuardDuty:OK')
                  except Exception as e:
                      print(f"[WARN] GuardDuty: {e}")
                      results.append('GuardDuty:WARN')
              else:
                  results.append('GuardDuty:SKIPPED')

              # 3. Inspector
              if enable_insp:
                  try:
                      insp = boto3.client('inspector2', region_name=region)
                      insp.enable(
                          resourceTypes=['EC2', 'ECR', 'LAMBDA', 'LAMBDA_CODE'],
                          accountIds=[account_id]
                      )
                      print("[OK] Inspector enabled (EC2, ECR, Lambda)")
                      results.append('Inspector:OK')
                  except Exception as e:
                      print(f"[WARN] Inspector: {e}")
                      results.append('Inspector:WARN')
              else:
                  results.append('Inspector:SKIPPED')

              # 4. IAM Access Analyzer
              if enable_aa:
                  try:
                      aa = boto3.client('accessanalyzer', region_name=region)
                      analyzers = aa.list_analyzers(type='ACCOUNT')['analyzers']
                      if analyzers:
                          print(f"[OK] Access Analyzer already exists: {analyzers[0]['name']}")
                      else:
                          aa.create_analyzer(
                              analyzerName='account-analyzer',
                              type='ACCOUNT'
                          )
                          print("[OK] Access Analyzer created")
                      results.append('AccessAnalyzer:OK')
                  except Exception as e:
                      print(f"[WARN] Access Analyzer: {e}")
                      results.append('AccessAnalyzer:WARN')
              else:
                  results.append('AccessAnalyzer:SKIPPED')

              # 5. Config Recorder
              if enable_cfg:
                  try:
                      cfg = boto3.client('config', region_name=region)
                      recorders = cfg.describe_configuration_recorders()['ConfigurationRecorders']
                      if recorders:
                          print(f"[OK] Config recorder already exists: {recorders[0]['name']}")
                      else:
                          # Create S3 bucket for Config
                          s3 = boto3.client('s3', region_name=region)
                          bucket_name = f'config-bucket-{account_id}-{region}'
                          try:
                              s3.create_bucket(Bucket=bucket_name)
                              s3.put_bucket_policy(Bucket=bucket_name, Policy=json.dumps({
                                  'Version': '2012-10-17',
                                  'Statement': [{
                                      'Sid': 'AWSConfigBucketPermissionsCheck',
                                      'Effect': 'Allow',
                                      'Principal': {'Service': 'config.amazonaws.com'},
                                      'Action': 's3:GetBucketAcl',
                                      'Resource': f'arn:aws:s3:::{bucket_name}'
                                  }, {
                                      'Sid': 'AWSConfigBucketDelivery',
                                      'Effect': 'Allow',
                                      'Principal': {'Service': 'config.amazonaws.com'},
                                      'Action': 's3:PutObject',
                                      'Resource': f'arn:aws:s3:::{bucket_name}/*',
                                      'Condition': {'StringEquals': {'s3:x-amz-acl': 'bucket-owner-full-control'}}
                                  }]
                              }))
                          except s3.exceptions.BucketAlreadyOwnedByYou:
                              pass
                          except Exception as be:
                              print(f"[WARN] Config bucket: {be}")

                          try:
                              cfg.put_configuration_recorder(ConfigurationRecorder={
                                  'name': 'default',
                                  'roleARN': f'arn:aws:iam::{account_id}:role/aws-service-role/config.amazonaws.com/AWSServiceRoleForConfig',
                                  'recordingGroup': {'allSupported': True, 'includeGlobalResourceTypes': True}
                              })
                              cfg.put_delivery_channel(DeliveryChannel={
                                  'name': 'default',
                                  's3BucketName': bucket_name,
                              })
                              cfg.start_configuration_recorder(ConfigurationRecorderName='default')
                              print("[OK] Config recorder started")
                          except Exception as ce:
                              print(f"[WARN] Config recorder: {ce}")
                      results.append('Config:OK')
                  except Exception as e:
                      print(f"[WARN] Config: {e}")
                      results.append('Config:WARN')
              else:
                  results.append('Config:SKIPPED')

              send_response(event, context, 'SUCCESS',
                  f'Security services: {", ".join(results)}',
                  {'Results': ', '.join(results)})

  SecurityEnablementCustomResource:
    Type: Custom::SecurityEnablement
    Condition: RunSecurityServices
    DependsOn: SecurityEnablementRole
    Properties:
      ServiceToken: !GetAtt SecurityEnablementFunction.Arn
      EnableSecurityHub: !Ref EnableSecurityHub
      EnableGuardDuty: !Ref EnableGuardDuty
      EnableInspector: !Ref EnableInspector
      EnableAccessAnalyzer: !Ref EnableAccessAnalyzer
      EnableConfigRecorder: !Ref EnableConfigRecorder

