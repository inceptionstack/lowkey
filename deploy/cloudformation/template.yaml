          def handler(event, context):
              print(f"[INFO] Event: {json.dumps(event)}")
              if event['RequestType'] == 'Delete':
                  send_response(event, context, 'SUCCESS', 'Delete is a no-op')
                  return

              props = event.get('ResourceProperties', {})
              instance_id = props.get('InstanceId', '')
              dashboard_url = props.get('DashboardUrl', '')
              region = props.get('Region', 'us-east-1')

              if not instance_id or not dashboard_url:
                  send_response(event, context, 'FAILED', 'Missing InstanceId or DashboardUrl')
                  return

              ssm = boto3.client('ssm', region_name=region)
              # Patch config.json with dashboard.url and restart gateway
              command = f"""#!/bin/bash
          set -e
          CONFIG_FILE="/home/ec2-user/.kiro/crew/config.json"
          mkdir -p "$(dirname "$CONFIG_FILE")"
          if [ -f "$CONFIG_FILE" ]; then
            # Merge dashboard.url into existing config
            python3 -c "
          import json, sys
          cfg = json.load(open('$CONFIG_FILE'))
          cfg.setdefault('dashboard', {{}})['url'] = '{dashboard_url}'
          json.dump(cfg, open('$CONFIG_FILE', 'w'), indent=2)
          print('Updated dashboard.url in config.json')
          "
          else
            echo '{{"dashboard": {{"url": "{dashboard_url}"}}}}' > "$CONFIG_FILE"
            chown ec2-user:ec2-user "$CONFIG_FILE"
          fi
          # Restart gateway to pick up new config
          if systemctl is-active --quiet kirocrew-gateway 2>/dev/null; then
            systemctl restart kirocrew-gateway
            echo 'Restarted kirocrew-gateway'
          fi
          """
              try:
                  resp = ssm.send_command(
                      InstanceIds=[instance_id],
                      DocumentName='AWS-RunShellScript',
                      Parameters={'commands': [command]},
                      TimeoutSeconds=120
                  )
                  cmd_id = resp['Command']['CommandId']
                  # Wait for completion (tolerate InvocationDoesNotExist during agent pickup)
                  result = None
                  for _ in range(30):
                      time.sleep(5)
                      try:
                          result = ssm.get_command_invocation(
                              CommandId=cmd_id, InstanceId=instance_id)
                      except ssm.exceptions.InvocationDoesNotExist:
                          continue
                      if result['Status'] in ('Success', 'Failed', 'TimedOut', 'Cancelled'):
                          break
                  if result is None:
                      send_response(event, context, 'FAILED', 'SSM command timed out waiting for invocation')
                      return
                  if result['Status'] == 'Success':
                      send_response(event, context, 'SUCCESS', 'dashboard.url configured',
                          {'DashboardUrl': dashboard_url})
                  else:
                      send_response(event, context, 'FAILED',
                          f"SSM command {result['Status']}: {result.get('StandardErrorContent', '')[:200]}")
              except Exception as e:
                  send_response(event, context, 'FAILED', str(e)[:256])

  KiroCrewDashboardConfigResource:
    Type: Custom::KiroCrewDashboardConfig
    Condition: IsKiroCrew
    DependsOn:
      - Instance
      - KiroCrewDistribution
    Properties:
      ServiceToken: !GetAtt KiroCrewDashboardConfigFunction.Arn
      InstanceId: !Ref Instance
      DashboardUrl: !Sub 'https://${KiroCrewDistribution.DomainName}'
      Region: !Ref 'AWS::Region'

  # --------------------------------------------------------------------------
  # WebUI Authentication (Cognito) — created only for KiroCrew with auth enabled
  # --------------------------------------------------------------------------
  WebUIUserPool:
    Type: AWS::Cognito::UserPool
    Condition: EnableWebUI
    Properties:
      UserPoolName: !Sub 'lowkey-${PackName}-${EnvironmentName}'
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 1
      Schema:
        - Name: email
          Required: true
          Mutable: true
      UserPoolTags:
        loki:managed: 'true'
        loki:pack: !Ref PackName
        loki:env: !Ref EnvironmentName

  WebUIUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Condition: EnableWebUI
    Properties:
      UserPoolId: !Ref WebUIUserPool
      Domain: !Sub 'lowkey-${PackName}-${EnvironmentName}-${AWS::AccountId}'

  WebUIUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: EnableWebUI
    DependsOn: KiroCrewDistribution
    Properties:
      UserPoolId: !Ref WebUIUserPool
      ClientName: !Sub '${PackName}-webui'
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      SupportedIdentityProviders:
        - COGNITO
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
      CallbackURLs:
        - !Sub 'https://${KiroCrewDistribution.DomainName}/auth/callback'
        - 'http://localhost:5476/auth/callback'
      LogoutURLs:
        - !Sub 'https://${KiroCrewDistribution.DomainName}/logout'
        - !Sub 'https://${KiroCrewDistribution.DomainName}/'
        - 'http://localhost:5476/'
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  WebUIAdminSecret:
    Type: AWS::SecretsManager::Secret
    Condition: EnableWebUI
    Properties:
      Name: !Sub '/lowkey/${EnvironmentName}/webui-admin'
      Description: !Sub 'Initial WebUI admin credentials for ${EnvironmentName}'
      SecretString: !Sub '{"email":"${WebUIAdminEmail}","password":"pending-lambda-write"}'
      Tags:
        - Key: loki:managed
          Value: 'true'
        - Key: loki:pack
          Value: !Ref PackName
        - Key: loki:env
          Value: !Ref EnvironmentName

  WebUIUserCreationRole:
    Type: AWS::IAM::Role
    Condition: EnableWebUI
    Properties:
      RoleName: !Sub '${EnvironmentName}-webui-user-creation-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CognitoUserCreation
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminSetUserPassword
                  - cognito-idp:AdminDeleteUser
                Resource: !GetAtt WebUIUserPool.Arn
              - Effect: Allow
                Action:
                  - secretsmanager:PutSecretValue
                  - secretsmanager:UpdateSecret
                Resource:
                  - !Ref WebUIAdminSecret
                  - !Ref EdgeConfigSecretArn
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref SigningKeySecretArn

  WebUIUserCreationFunction:
    Type: AWS::Lambda::Function
    Condition: EnableWebUI
    Properties:
      FunctionName: !Sub '${EnvironmentName}-webui-user-creation'
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt WebUIUserCreationRole.Arn
      Environment:
        Variables:
          SECRET_ARN: !Ref WebUIAdminSecret
      Code:
        ZipFile: |
          import json, os, urllib.request, secrets, string, boto3

          def send_response(event, context, status, reason='', data=None):
              data = data or {}
              reason_str = (reason or f'See CW: {context.log_stream_name}')[:256]
              phys_id = (event.get('PhysicalResourceId') or context.log_stream_name or 'custom-resource')[-64:]
              safe_data = {k: str(v)[:128] for k, v in data.items()}
              body = json.dumps({
                  'Status': status, 'Reason': reason_str,
                  'PhysicalResourceId': phys_id,
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': safe_data if len(json.dumps(safe_data)) < 1024 else {}
              }).encode()
              req = urllib.request.Request(event['ResponseURL'], data=body,
                  headers={'Content-Type': 'application/json', 'Content-Length': len(body)},
                  method='PUT')
              urllib.request.urlopen(req)

          def generate_password():
              upper = secrets.choice(string.ascii_uppercase)
              lower = secrets.choice(string.ascii_lowercase)
              digit = secrets.choice(string.digits)
              symbol = secrets.choice('!@#$%&*')
              remainder = [secrets.choice(string.ascii_letters + string.digits + '!@#$%&*') for _ in range(12)]
              pwd = [upper, lower, digit, symbol] + remainder
              secrets.SystemRandom().shuffle(pwd)
              return ''.join(pwd)

          def write_admin_secret(sm, secret_arn, email, password):
              sm.put_secret_value(
                  SecretId=secret_arn,
                  SecretString=json.dumps({'email': email, 'password': password})
              )

          def write_edge_config(sm, secret_arn, pool_id, client_id, cognito_domain, signing_key, cognito_region):
              sm.put_secret_value(
                  SecretId=secret_arn,
                  SecretString=json.dumps({
                      'poolId': pool_id,
                      'clientId': client_id,
                      'cognitoDomain': cognito_domain,
                      'signingKey': signing_key,
                      'cognitoRegion': cognito_region,
                  })
              )

          def create_or_reset_user(cognito, pool_id, email, password):
              try:
                  cognito.admin_create_user(
                      UserPoolId=pool_id,
                      Username=email,
                      UserAttributes=[
                          {'Name': 'email', 'Value': email},
                          {'Name': 'email_verified', 'Value': 'true'}
                      ],
                      MessageAction='SUPPRESS'
                  )
              except cognito.exceptions.UsernameExistsException:
                  # User exists (stack update or re-run); reset password so the credentials
                  # in Secrets Manager remain authoritative.
                  pass
              cognito.admin_set_user_password(
                  UserPoolId=pool_id,
                  Username=email,
                  Password=password,
                  Permanent=True
              )

          def delete_user_safely(cognito, pool_id, email):
              if not email:
                  return
              try:
                  cognito.admin_delete_user(UserPoolId=pool_id, Username=email)
              except cognito.exceptions.UserNotFoundException:
                  pass
              except Exception as e:
                  print(f'[WARN] Could not delete old user {email}: {e}')

          def handler(event, context):
              # Never log ResourceProperties (contains email + secret ARNs)
              print(f"[INFO] RequestType={event.get('RequestType')} LogicalId={event.get('LogicalResourceId')}")
              try:
                  if event['RequestType'] == 'Delete':
                      send_response(event, context, 'SUCCESS', 'Delete is a no-op')
                      return

                  props = event.get('ResourceProperties', {})
                  old_props = event.get('OldResourceProperties', {})
                  pool_id = props.get('UserPoolId', '')
                  client_id = props.get('ClientId', '')
                  cognito_domain = props.get('CognitoDomain', '')
                  email = props.get('AdminEmail', '')
                  admin_secret_arn = props.get('AdminSecretArn', '')
                  edge_config_secret_name = props.get('EdgeConfigSecretName', '')
                  edge_config_secret_arn = props.get('EdgeConfigSecretArn', '')
                  signing_key_secret_name = props.get('SigningKeySecretName', '')
                  signing_key_secret_arn = props.get('SigningKeySecretArn', '')
                  edge_region = props.get('EdgeRegion', 'us-east-1')
                  region = props.get('Region', os.environ.get('AWS_REGION', 'us-east-1'))

                  missing = [k for k, v in {
                      'UserPoolId': pool_id,
                      'ClientId': client_id,
                      'CognitoDomain': cognito_domain,
                      'AdminEmail': email,
                      'AdminSecretArn': admin_secret_arn,
                      'EdgeConfigSecretName': edge_config_secret_name,
                      'SigningKeySecretName': signing_key_secret_name,
                  }.items() if not v]
                  if missing:
                      send_response(event, context, 'FAILED', f'Missing props: {missing}')
                      return

                  cognito = boto3.client('cognito-idp', region_name=region)
                  sm_local = boto3.client('secretsmanager', region_name=region)
                  sm_edge = boto3.client('secretsmanager', region_name=edge_region)

                  # On Update, delete the old admin user if email changed
                  if event['RequestType'] == 'Update':
                      old_email = old_props.get('AdminEmail', '')
                      if old_email and old_email != email:
                          delete_user_safely(cognito, pool_id, old_email)

                  # 1) Provision the admin user in Cognito and store credentials
                  # in the local (main-stack region) admin secret.
                  password = generate_password()
                  create_or_reset_user(cognito, pool_id, email, password)
                  write_admin_secret(sm_local, admin_secret_arn, email, password)

                  # 2) Read the CFN-generated signing key from us-east-1 (edge stack)
                  # and write the merged edge config to us-east-1 (edge stack).
                  # Both live in us-east-1 because the Lambda@Edge reads them there.
                  sk_resp = sm_edge.get_secret_value(SecretId=signing_key_secret_name)
                  signing_key = json.loads(sk_resp['SecretString'])['key']
                  write_edge_config(sm_edge, edge_config_secret_name, pool_id, client_id, cognito_domain, signing_key, region)

                  send_response(event, context, 'SUCCESS', 'Admin user + edge config provisioned',
                      {'Email': email})
              except Exception as e:
                  err = f'{type(e).__name__}: {str(e)[:180]}'
                  print(f'[ERROR] {err}')
                  send_response(event, context, 'FAILED', err)
  WebUIUserCreationResource:
    Type: Custom::WebUIUserCreation
    Condition: EnableWebUI
    DependsOn:
      - WebUIUserPool
      - WebUIUserPoolClient
    Properties:
      ServiceToken: !GetAtt WebUIUserCreationFunction.Arn
      UserPoolId: !Ref WebUIUserPool
      ClientId: !Ref WebUIUserPoolClient
      CognitoDomain: !Sub '${WebUIUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
      AdminEmail: !Ref WebUIAdminEmail
      AdminSecretArn: !Ref WebUIAdminSecret
      EdgeConfigSecretName: !Ref EdgeConfigSecretName
      EdgeConfigSecretArn: !Ref EdgeConfigSecretArn
      SigningKeySecretName: !Ref SigningKeySecretName
      SigningKeySecretArn: !Ref SigningKeySecretArn
      EdgeRegion: 'us-east-1'
      Region: !Ref 'AWS::Region'

  # --------------------------------------------------------------------------
  # WebUI Lambda@Edge (Cognito enforcement on CloudFront)
  # --------------------------------------------------------------------------
  # Two secrets:
  # - SigningKeySecret: raw HMAC key, CFN-managed via GenerateSecretString.
  #   Never rewritten by the Custom Resource. Read once by the Custom Resource
  #   to merge into EdgeConfigSecret.
  # - EdgeConfigSecret: the merged config {poolId, clientId, cognitoDomain,
  #   signingKey} that the Lambda@Edge reads at cold start. Populated by the
  #   Custom Resource after Cognito resources are created.
  # SSM Session Manager Preferences (auto-login as ec2-user with welcome)
  # --------------------------------------------------------------------------
  # --------------------------------------------------------------------------
  # EC2 Instance
  # --------------------------------------------------------------------------
  Instance:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal:
        Timeout: PT30M
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Sub '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-arm64}}'
      IamInstanceProfile: !Ref InstanceProfile
      KeyName: !If [HasKeyPair, !Ref KeyPairName, !Ref 'AWS::NoValue']
      SubnetId: !If [CreateNewVpc, !Ref PublicSubnet, !Ref ExistingSubnetId]
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 2
        HttpEndpoint: enabled
      EbsOptimized: true
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref RootVolumeSize
            VolumeType: gp3
            DeleteOnTermination: true
            Encrypted: true
        - !If
          - HasDataVolume
          - DeviceName: /dev/sdb
            Ebs:
              VolumeSize: !Ref DataVolumeSize
              VolumeType: gp3
              DeleteOnTermination: false
              Encrypted: true
          - !Ref AWS::NoValue
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-instance'
        - Key: Application
          Value: OpenClaw
        - Key: loki:managed
          Value: 'true'
        - Key: loki:watermark
          Value: !Ref LokiWatermark
        - Key: loki:deploy-method
          Value: cloudformation
        - Key: loki:version
          Value: '1.0'
        - Key: loki:pack
          Value: !Ref PackName
        - Key: loki:profile
          Value: !Ref ProfileName
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          # Export all params as env vars for the bootstrap script
          export ACCT_ID="${AWS::AccountId}"
          export REGION="${AWS::Region}"
          export STACK_NAME="${AWS::StackName}"
          export DEFAULT_MODEL="${DefaultModel}"
          export BEDROCK_REGION="${BedrockRegion}"
          export GW_PORT="${OpenClawGatewayPort}"
          export MODEL_MODE="${ModelMode}"
          export LITELLM_BASE_URL="${LiteLLMBaseUrl}"
          export LITELLM_API_KEY="${LiteLLMApiKey}"
          export LITELLM_MODEL="${LiteLLMModel}"
          export PROVIDER_API_KEY="${ProviderApiKey}"
          export KIRO_FROM_SECRET="${KiroFromSecret}"
          export TELEGRAM_BOT_TOKEN_SECRET="${TelegramBotTokenSecret}"
          export TELEGRAM_USER="${TelegramUser}"
          export KIROCREW_TG_BOT_TOKEN_SECRET="${KirocrewTgBotTokenSecret}"
          export KIROCREW_TG_USER_ID="${KirocrewTgUserId}"
          export PACK_NAME="${PackName}"
          export PROFILE_NAME="${ProfileName}"
          # Publish failure to SSM and signal CFN on any error
          trap '
            aws ssm put-parameter --name "/loki/setup-status" \
              --value "FAILED" --type String --overwrite --region "$REGION" 2>/dev/null || true
            aws ssm put-parameter --name "/loki/setup-step" \
              --value "FAILED: userdata error at line $LINENO" \
              --type String --overwrite --region "$REGION" 2>/dev/null || true
            touch /tmp/loki-bootstrap-done
            if [[ -x /opt/aws/bin/cfn-signal ]]; then
              /opt/aws/bin/cfn-signal -e 1 --stack "${!STACK_NAME}" --resource Instance --region "$REGION" 2>/dev/null || true
            else
              _IMDS_TOKEN=$(curl -sf -X PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 60" 2>/dev/null || true)
              _INSTANCE_ID=$([[ -n "$_IMDS_TOKEN" ]] && curl -sf -H "X-aws-ec2-metadata-token: $_IMDS_TOKEN" http://169.254.169.254/latest/meta-data/instance-id 2>/dev/null || echo unknown)
              aws cloudformation signal-resource --stack-name "${!STACK_NAME}" --logical-resource-id Instance --unique-id "$_INSTANCE_ID" --status FAILURE --region "$REGION" 2>/dev/null || true
            fi
          ' ERR
          # Ensure git is available (not present on all AMIs)
          command -v git &>/dev/null || dnf install -y git 2>/dev/null || yum install -y git
          # Clone repo with retry (GitHub blips shouldn't kill bootstrap)
          _cloned=false
          for _attempt in 1 2 3; do
            git clone --depth 1 -b "${RepoBranch}" https://github.com/inceptionstack/lowkey.git /tmp/lowkey && _cloned=true && break
            echo "git clone failed (attempt $_attempt), retrying in 10s..." && sleep 10
          done
          if [[ "$_cloned" != "true" ]]; then
            echo "FATAL: git clone failed after 3 attempts" >&2
            exit 1
          fi
          bash /tmp/lowkey/deploy/bootstrap.sh \
            --pack "$PACK_NAME" \
            --profile "$PROFILE_NAME" \
            --region "$BEDROCK_REGION" \
            --model "$DEFAULT_MODEL" \
            --gw-port "$GW_PORT" \
            --model-mode "$MODEL_MODE" \
            --litellm-base-url "$LITELLM_BASE_URL" \
            --litellm-api-key "$LITELLM_API_KEY" \
            --litellm-model "$LITELLM_MODEL" \
            --provider-api-key "$PROVIDER_API_KEY" \
            --kiro-from-secret "$KIRO_FROM_SECRET" \
            --telegram-bot-token-secret "$TELEGRAM_BOT_TOKEN_SECRET" \
            --telegram-user "$TELEGRAM_USER" \
            --kirocrew-tg-bot-token-secret "$KIROCREW_TG_BOT_TOKEN_SECRET" \
            --kirocrew-tg-user-id "$KIROCREW_TG_USER_ID" \
            --primary "${Primary}" \
            --daily-driver "${DailyDriver}" \
            --codex-model "${CodexModel}"
          # Signal CFN success - defense-in-depth: bootstrap.sh also signals,
          # but this catches edge cases where bootstrap.sh signal fails silently.
          # CFN ignores duplicate signals, so double-fire is safe.
          # Install cfn-bootstrap if needed - not on AL2023 by default.
          if [[ ! -x /opt/aws/bin/cfn-signal ]]; then
            dnf install -y python3-pip 2>/dev/null || true
            pip3 install https://s3.amazonaws.com/cloudformation-examples/aws-cfn-bootstrap-py3-latest.tar.gz 2>/dev/null || true
          fi
          if [[ -x /opt/aws/bin/cfn-signal ]]; then
            /opt/aws/bin/cfn-signal -e 0 --stack "$STACK_NAME" --resource Instance --region "$REGION" 2>/dev/null || true
          else
            # Fallback: signal via AWS CLI
            _IMDS_TOKEN=$(curl -sf -X PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 60" 2>/dev/null || true)
            _INSTANCE_ID=$([[ -n "$_IMDS_TOKEN" ]] && curl -sf -H "X-aws-ec2-metadata-token: $_IMDS_TOKEN" http://169.254.169.254/latest/meta-data/instance-id 2>/dev/null || echo unknown)
            aws cloudformation signal-resource \
              --stack-name "$STACK_NAME" \
              --logical-resource-id Instance \
              --unique-id "$_INSTANCE_ID" \
              --status SUCCESS \
              --region "$REGION" 2>/dev/null || true
          fi
# ============================================================================
# OUTPUTS
# ============================================================================
Outputs:
  InstanceId:
    Description: EC2 Instance ID
    Value: !Ref Instance

  PublicIp:
    Description: Public IP address
    Value: !GetAtt Instance.PublicIp

  PrivateIp:
    Description: Private IP address
    Value: !GetAtt Instance.PrivateIp

  VpcId:
    Description: VPC ID
    Value: !If [CreateNewVpc, !Ref VPC, !Ref ExistingVpcId]

  SecurityGroupId:
    Description: Security Group ID
    Value: !Ref InstanceSecurityGroup

  RoleArn:
    Description: IAM Role ARN
    Value: !GetAtt InstanceRole.Arn

  SSMConnect:
    Description: Connect via SSM Session Manager
    Value: !Sub 'aws ssm start-session --target ${Instance} --region ${AWS::Region}'

  PackName:
    Description: "Deployed agent pack"
    Value: !Ref PackName

  ProfileName:
    Description: "Deployed permission profile"
    Value: !Ref ProfileName

  KiroCrewDashboardUrl:
    Condition: IsKiroCrew
    Description: KiroCrew dashboard URL (CloudFront HTTPS)
    Value: !Sub 'https://${KiroCrewDistribution.DomainName}'

  KiroCrewALBDns:
    Condition: IsKiroCrew
    Description: KiroCrew ALB DNS name (do not access directly - use CloudFront)
    Value: !GetAtt KiroCrewALB.DNSName

  WebUICognitoPoolId:
    Condition: EnableWebUI
    Description: Cognito User Pool ID for WebUI auth
    Value: !Ref WebUIUserPool

  WebUICognitoClientId:
    Condition: EnableWebUI
    Description: Cognito App Client ID for WebUI auth
    Value: !Ref WebUIUserPoolClient

  WebUICognitoDomain:
    Condition: EnableWebUI
    Description: Cognito hosted-UI domain
    Value: !Sub '${WebUIUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'

  WebUIAdminEmailOutput:
    Condition: EnableWebUI
    Description: Email of the initial WebUI admin user
    Value: !Ref WebUIAdminEmail

  WebUIAdminSecretArn:
    Condition: EnableWebUI
    Description: ARN of Secrets Manager secret holding initial WebUI admin credentials (email + password). Rotate/delete after first use.
    Value: !Ref WebUIAdminSecret

  WebUIEdgeFunctionArn:
    Condition: EnableWebUI
    Description: Lambda@Edge function version ARN attached to the CloudFront distribution (viewer-request)
    Value: !Ref EdgeLambdaVersionArn

  WebUIEdgeSigningKeySecretArn:
    Condition: EnableWebUI
    Description: ARN of Secrets Manager secret holding the Lambda@Edge nonce/state signing key
    Value: !Ref SigningKeySecretArn

