name: hermes
version: "2.0.0"
type: agent
description: "NousResearch Hermes CLI agent with native Bedrock support"

deps: []

requirements:
  arch:
    - arm64
    - amd64
  os:
    - al2023
    - ubuntu2204
  min_instance_type: t4g.medium

params:
  - name: region
    description: "AWS region for Bedrock"
    default: us-east-1
  - name: hermes-model
    description: "Bedrock model ID (inference profile)"
    default: "us.anthropic.claude-sonnet-4-6"

health_check:
  command: "hermes --version"
  timeout: 10

provides:
  commands:
    - hermes
  services: []
