name: kirocrew
version: "1.0.0"
type: agent
description: "KiroCrew — multi-agent crew gateway on Kiro CLI (ACP) with dashboard, semantic memory, and MCP"

deps: []

requirements:
  arch:
    - arm64
    - amd64
  os:
    - al2023
    - ubuntu2204
  min_instance_type: t4g.medium

params:
  - name: region
    description: "AWS region (informational; Kiro uses its own cloud inference)"
    default: us-east-1
  - name: from-secret
    description: "AWS Secrets Manager secret id/arn for Kiro API key (headless mode)"
    default: ""
  - name: channel
    description: "KiroCrew release channel (stable | nightly | insider)"
    default: "stable"
  - name: kirocrew-version
    description: "KiroCrew version passed to the upstream installer as --version. Pinned by default; an empty value does NOT float to the channel's latest, because pack_config_get falls back to the pinned default whenever the configured value is empty. This is the published ARTIFACT version, not the GitHub release tag: upstream tag v0.4.1 ships the CLI wheel as 0.4.1rc1. Must be compatible with the channel: both values form the manifest path cli/<channel>/<version>/cli-manifest.json, and a pair that was never published there (e.g. stable/0.4.1, or insider/0.4.1rc1) returns 403 and fails the install."
    default: "0.4.1rc1"
  - name: extras
    description: "Comma-separated pip extras to install after wheel (voice, aws)"
    default: "aws,voice"
  - name: gateway-port
    description: "Port for the KiroCrew gateway (env: KIROCREW_PORT)"
    default: "5476"
  - name: start-gateway
    description: "Install and enable kirocrew-gateway systemd service (true|false)"
    default: "true"
  - name: kirocrew-home
    description: "Override KiroCrew data home (env: KIROCREW_HOME)"
    default: ""

health_check:
  command: "kiro-cli --version && kirocrew --version"
  timeout: 15

provides:
  commands:
    - kiro-cli
    - kirocrew
  services:
    - kirocrew-gateway

instance_type: t4g.medium
root_volume_gb: 40
data_volume_gb: 0

experimental: true
