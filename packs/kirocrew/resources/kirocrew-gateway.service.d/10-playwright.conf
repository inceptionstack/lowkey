[Service]
# Playwright registry.
#
# Point Playwright at a stable registry under a writable dir. Provision-time
# install lands the browsers here (see packs/kirocrew/install.sh step 6b).
#
# This drop-in used to carry ProtectHome=no and ReadWritePaths= for ~/.cache
# and ~/.config. The base unit no longer sets any mount-namespace hardening
# (see the note in kirocrew-gateway.service), so $HOME is writable without
# them, and ReadWritePaths= would itself recreate the private mount namespace
# that breaks `kirocrew token`.
Environment=PLAYWRIGHT_BROWSERS_PATH=/home/ec2-user/.local/share/ms-playwright
