[Service]
# Playwright registry + gh auth persistence.
#
# ProtectHome=no (Roy directive 2026-08-23 08:27):
# ProtectHome= only accepts yes | no | read-only | tmpfs. "read-write" is not
# a valid value — systemd silently ignores it and falls back to the base
# unit's ProtectHome=read-only, which reintroduces the very bug this drop-in
# is meant to fix (Codex P2 on 4e895d4). Using ProtectHome=no disables the
# protection entirely, so $HOME behaves like any normal Linux user home.
# ProtectSystem=strict, NoNewPrivileges=true, PrivateTmp=true kept on —
# this drop-in only relaxes $HOME, not the rest of the sandbox.
ProtectHome=no

# Additive across drop-ins. Belt-and-suspenders + documentation of intent:
# ~/.cache and ~/.config are the two dirs Playwright's daemon and gh's auth
# state actually need writable. If a future change tightens ProtectHome=,
# these two entries keep both features working.
ReadWritePaths=/home/ec2-user/.cache
ReadWritePaths=/home/ec2-user/.config

# Point Playwright at a stable registry under a writable dir. Provision-time
# install lands the browsers here (see packs/kirocrew/install.sh step 6b), so
# the CLI's daemon dir + browser payloads sit outside ~/.cache in case that
# gets remounted differently later.
Environment=PLAYWRIGHT_BROWSERS_PATH=/home/ec2-user/.local/share/ms-playwright
