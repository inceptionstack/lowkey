[Service]
# Playwright registry + gh auth persistence.
#
# ProtectHome moved from read-only to read-write (Roy directive 2026-08-23 08:27):
# lets the agent persist state under $HOME the same way it can on any normal
# Linux box. ProtectSystem=strict, NoNewPrivileges=true, PrivateTmp=true kept
# on — this drop-in only relaxes $HOME, not the rest of the sandbox.
ProtectHome=read-write

# Additive across drop-ins. Redundant belt-and-suspenders now that
# ProtectHome=read-write, but kept explicit so a future ProtectHome tightening
# still leaves the two dirs Playwright and gh actually need for writes.
ReadWritePaths=/home/ec2-user/.cache
ReadWritePaths=/home/ec2-user/.config

# Point Playwright at a stable registry under a writable dir. Provision-time
# install lands the browsers here (see packs/kirocrew/install.sh step 6b), so
# the CLI's daemon dir + browser payloads survive whatever ProtectHome later
# does to $HOME/.cache.
Environment=PLAYWRIGHT_BROWSERS_PATH=/home/ec2-user/.local/share/ms-playwright
